version: 1
project:
  title: Teoría y métodos de análisis de riesgos de desastres y climáticos
  subtitle: Fundamentos para evaluar ciudades de Colombia
  description: Libro de teoría y métodos (amenaza, exposición, vulnerabilidad y riesgo) para evaluar riesgos de desastres y climáticos en ciudades colombianas, alineado con CLIMAAX, CCDR-tools y CLIMADA.
  keywords: [riesgo de desastres, riesgo climático, amenaza, vulnerabilidad, Colombia, CLIMADA, CLIMAAX, CCDR]
  authors:
    - name: Mauricio Romero
      email: mauricio.romero.t@gmail.com
  license:
    content: CC-BY-4.0
  bibliography: [references.bib]
  numbering:
    figure:
      template: Figura %s
  exclude: ["fuentes/**", "plantilla/**", "scripts/**", "estilo/**", "plan/**", "CLAUDE.md", "book/03_amenazas/datos/**"]
  toc:
    - file: index.md
    - file: book/01_conceptos/index.md
      children:
        - pattern: book/01_conceptos/1*.md
    - file: book/02_metodologia/index.md
      children:
        - pattern: book/02_metodologia/2*.md
    # Las amenazas van en el primer nivel para que el sidebar las muestre siempre, con su ícono (como en EVA y CLIMAAX)
    # Sección 3: las amenazas se agrupan como en la sección GRD del sitio personal, que sigue los tipos de amenaza de los HIPs de UNDRR-ISC
    - file: book/03_amenazas/index.md
      children:
        - file: book/03_amenazas/_molde.md
          title: Molde de los capítulos
        - title: Amenazas geológicas
          children:
            - file: book/03_amenazas/301_sismo.md
              children:
                - file: book/03_amenazas/317_sismicidad_colombia.ipynb
                  title: Sismicidad con datos del USGS
            - file: book/03_amenazas/302_volcanes.md
            - file: book/03_amenazas/303_tsunami.md
              children:
                - file: book/03_amenazas/318_tsunami_tumaco_1979.ipynb
                  title: Tumaco 1979 (observaciones)
            - file: book/03_amenazas/304_mov_masa.md
        - title: Amenazas hidrológicas y meteorológicas
          children:
            - file: book/03_amenazas/305_inundacion.md
            - file: book/03_amenazas/316_avenidas_torrenciales.md
            - file: book/03_amenazas/308_sequia.md
            - file: book/03_amenazas/309_calor.md
            - file: book/03_amenazas/311_ciclones.md
              children:
                - file: book/03_amenazas/315_trayectorias_ciclones.ipynb
                  title: Trayectorias en el Caribe
            - file: book/03_amenazas/312_vendavales.md
        - title: Amenazas ambientales
          children:
            - file: book/03_amenazas/306_erosion_costera.md
            - file: book/03_amenazas/307_erosion_fluvial.md
            - file: book/03_amenazas/310_incendios.md
        - title: Amenazas tecnológicas
          children:
            - file: book/03_amenazas/319_natech.md
        - title: Análisis integrados
          children:
            - file: book/03_amenazas/313_analisis_multiamenaza.ipynb
              title: Análisis multiamenaza
            - file: book/03_amenazas/314_riesgos_cascada.ipynb
              title: Riesgos en cascada
    - file: book/04_vulnerabilidad/index.md
      children:
        - pattern: book/04_vulnerabilidad/4*.md
    - file: book/05_sintesis/index.md
      children:
        - pattern: book/05_sintesis/5*.md
    - title: Recursos
      children:
        - file: book/recursos/fuentes_colombia.md
        - file: book/recursos/glosario.md
site:
  template: book-theme
  title: Teoría de riesgos
  options:
    logo: estilo/logo.svg
    logo_dark: estilo/logo_oscuro.svg
    logo_alt: Teoría de riesgos
    logo_text: Teoría y métodos de análisis de riesgos de desastres y climáticos
    favicon: estilo/favicon.png
    style: estilo/teoria.css
  parts:
    primary_sidebar_footer: estilo/pie_sidebar.md
