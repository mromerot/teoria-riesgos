name: Publicar el libro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /teoria-riesgos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar MyST
        run: npm install -g mystmd
      - name: Construir
        run: myst build --html
      - name: Fijar la URL pública en sitemap y robots
        run: sed -i "s#http://localhost:3000#https://mromerot.github.io/teoria-riesgos#g" _build/html/sitemap.xml _build/html/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
